<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Logo Ticker Strip</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root { --brand:#1D2CF3; --white:#FFFFFF; }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; background:transparent; }
  body { font-family:"Montserrat",system-ui,-apple-system,Segoe UI,sans-serif; -webkit-font-smoothing:antialiased; }

  .page { width:960px; max-width:100%; margin:0 auto; }
  .panel { background:var(--brand); overflow:hidden; position:relative; }

  /* ---------------- DESKTOP (default) ---------------- */
  .marquee {
    padding:56px 0;
    -webkit-mask-image:linear-gradient(to right,transparent 0,#000 80px,#000 calc(100% - 80px),transparent 100%);
            mask-image:linear-gradient(to right,transparent 0,#000 80px,#000 calc(100% - 80px),transparent 100%);
  }
  .row + .row { margin-top:40px; }
  .ticker-track {
    display:flex; width:max-content; align-items:center; gap:96px;
    animation:ticker-scroll var(--speed,40s) linear infinite; will-change:transform;
  }
  .ticker-track.reverse { animation-direction:reverse; }
  .ticker-track.paused  { animation-play-state:paused; }
  @keyframes ticker-scroll { from { transform:translate3d(0,0,0); } to { transform:translate3d(-50%,0,0); } }
  .logo { flex:0 0 auto; height:120px; min-width:200px; display:inline-flex; align-items:center; justify-content:center; color:var(--white); }
  .logo img { width:auto; display:block; }

  /* ---------------- MOBILE (auto-switch under 600px) ---------------- */
  @media (max-width:600px) {
    .page  { width:100%; }
    .panel { min-height:258px; display:flex; flex-direction:column; justify-content:center; }
    .marquee {
      padding:29px 0;
      -webkit-mask-image:linear-gradient(to right,transparent 0,#000 28px,#000 calc(100% - 28px),transparent 100%);
              mask-image:linear-gradient(to right,transparent 0,#000 28px,#000 calc(100% - 28px),transparent 100%);
    }
    .row + .row     { margin-top:25px; }
    .row, .marquee  { overflow:visible; }     /* let enlarged logos show fully */
    .ticker-track   { gap:20px; animation-duration:24s; }
    .logo           { height:50px; min-width:0; }
    .logo img       { height:auto !important; max-height:34px !important; max-width:92px !important; object-fit:contain; }
    /* Enlarged marks on mobile */
    .logo[data-logo="templar"]  img { max-height:102px !important; max-width:276px !important; }
    .logo[data-logo="opengame"] img { max-height:102px !important; max-width:276px !important; }
  }

  @media (prefers-reduced-motion: reduce) { .ticker-track { animation:none; } }
</style>
</head>
<body>
  <main class="page">
    <section id="display-root" class="panel" aria-label="Partner logos" data-screen-label="Logo Ticker"></section>
  </main>

    (function(){
      var ROWS = 3, root = document.getElementById('display-root');
      var wrap = document.createElement('div'); wrap.className = 'marquee';
      var rows = []; for (var i=0;i<ROWS;i++) rows.push([]);
      LOGOS.forEach(function(l,i){ rows[i%ROWS].push(l); });
      rows.forEach(function(row,ri){
        var rowEl = document.createElement('div'); rowEl.className = 'row';
        var track = document.createElement('div'); track.className = 'ticker-track' + (ri%2 ? ' reverse' : '');
        var items = row.concat(row);
        items.forEach(function(l){
          var logo = document.createElement('div'); logo.className = 'logo'; logo.setAttribute('data-logo', l.id);
          var span = document.createElement('span'); span.style.cssText = 'display:inline-flex;align-items:center;';
          var img = document.createElement('img'); img.src = l.src; img.alt = '';
          img.style.cssText = 'height:' + l.h + 'px;width:auto;display:block;' + (l.tint ? 'filter:brightness(0) invert(1);' : '');
          span.appendChild(img); logo.appendChild(span); track.appendChild(logo);
        });
        rowEl.appendChild(track); wrap.appendChild(rowEl);
      });
      root.appendChild(wrap);
      root.addEventListener('mouseenter', function(){ wrap.querySelectorAll('.ticker-track').forEach(function(t){ t.classList.add('paused'); }); });
      root.addEventListener('mouseleave', function(){ wrap.querySelectorAll('.ticker-track').forEach(function(t){ t.classList.remove('paused'); }); });
    })();
  </script>
